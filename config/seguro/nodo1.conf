# nodo1 — miembro con datos (primario preferido)
# Modo: seguro (Paso 3: autenticación obligatoria)
# Lanzar SIEMPRE desde la raíz del repo: las rutas son relativas a ella.

storage:
  dbPath: data/nodo1
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25        # 3 nodos en una misma PC: limitamos la RAM de cada uno

systemLog:
  destination: file
  path: logs/nodo1.log
  logAppend: true

net:
  port: 27017
  bindIp: 127.0.0.1            # solo escucha en la propia máquina, nunca en 0.0.0.0

replication:
  replSetName: rs0

security:
  authorization: enabled       # toda operación exige usuario y contraseña
  keyFile: secrets/mongo-keyfile   # autenticación interna entre los nodos del Replica Set
