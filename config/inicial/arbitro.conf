# arbitro — árbitro: vota en las elecciones, no guarda datos
# Modo: inicial (Pasos 1 y 2: sin autenticación)
# Lanzar SIEMPRE desde la raíz del repo: las rutas son relativas a ella.

storage:
  dbPath: data/arbitro
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25        # 3 nodos en una misma PC: limitamos la RAM de cada uno

systemLog:
  destination: file
  path: logs/arbitro.log
  logAppend: true

net:
  port: 27019
  bindIp: 127.0.0.1            # solo escucha en la propia máquina, nunca en 0.0.0.0

replication:
  replSetName: rs0
